name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  preparar:
    name: Preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar archivos publicos
        run: |
          mkdir -p site-dist
          cp index.html styles.css app.js core.mjs site-dist/
          test -s site-dist/index.html
      - name: Subir sitio como artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  publicar:
    name: Publicar en GitHub Pages
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dar tiempo a la disponibilidad del artefacto
        run: sleep 20
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
